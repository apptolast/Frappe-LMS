apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frappe-lms
  namespace: apptolast-frappe-lms
  labels:
    app: frappe-lms
    environment: production
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`academy.apptolast.com`)
      kind: Rule
      services:
        - name: frappe-lms
          port: 8000
          # Sticky sessions para WebSocket
          sticky:
            cookie:
              name: frappe_session
              secure: true
              httpOnly: true
      middlewares:
        - name: security-headers
  tls:
    secretName: frappe-lms-tls

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: apptolast-frappe-lms
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
      Server: ""
    sslRedirect: true
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
    frameDeny: false
    customFrameOptionsValue: "SAMEORIGIN"
