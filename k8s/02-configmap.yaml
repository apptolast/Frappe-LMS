apiVersion: v1
kind: ConfigMap
metadata:
  name: frappe-lms-config
  namespace: apptolast-frappe-lms
  labels:
    app: frappe-lms
    environment: production
data:
  # Configuración común del site de Frappe (sin credenciales sensibles)
  common_site_config.json: |
    {
      "db_host": "mariadb-frappe-lms",
      "db_port": 3306,
      "redis_cache": "redis://redis-frappe-lms:6379/0",
      "redis_queue": "redis://redis-frappe-lms:6379/1",
      "redis_socketio": "redis://redis-frappe-lms:6379/2",
      "socketio_port": 9000,
      "webserver_port": 8000,
      "serve_default_site": true,
      "default_site": "lms.localhost",
      "auto_update": false,
      "maintenance_mode": 0,
      "pause_scheduler": 0,
      "host_name": "https://academy.apptolast.com"
    }
