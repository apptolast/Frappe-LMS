apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-frappe-lms
  namespace: apptolast-frappe-lms
  labels:
    app: redis-frappe-lms
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-frappe-lms
  template:
    metadata:
      labels:
        app: redis-frappe-lms
        environment: production
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis-frappe-lms
  namespace: apptolast-frappe-lms
  labels:
    app: redis-frappe-lms
    environment: production
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: redis-frappe-lms
