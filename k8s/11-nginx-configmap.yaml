apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: apptolast-frappe-lms
  labels:
    app: frappe-lms
    environment: production
data:
  default.conf: |
    upstream frappe-server {
        server 127.0.0.1:8000 fail_timeout=0;
    }

    upstream socketio-server {
        server 127.0.0.1:9000 fail_timeout=0;
    }

    # Map to detect if request came via HTTPS (from ingress/LB)
    map $http_x_forwarded_proto $redirect_scheme {
        default https;
        https https;
        http http;
    }

    server {
        listen 80;
        server_name academy.apptolast.com;
        root /home/frappe/frappe-bench/sites;

        # Force HTTPS scheme for all redirects
        absolute_redirect off;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # Assets estáticos - servidos directamente por nginx
        # (los symlinks se reemplazan con directorios reales en el init container)
        location /assets {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000";
        }

        location ~ ^/protected/(.*) {
            internal;
            try_files /lms.localhost/$1 =404;
        }

        # Socket.IO - proxy al servidor Node.js en puerto 9000
        location /socket.io {
            proxy_pass http://socketio-server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Frappe-Site-Name lms.localhost;
            proxy_set_header Origin https://$http_host;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }

        location / {
            # Remove trailing slash - redirect to HTTPS explicitly
            if ($request_uri ~ ^(.+)/$) {
                return 301 https://$host$1;
            }
            
            rewrite ^(.+)/index\.html$ $1 permanent;
            rewrite ^(.+)\.html$ $1 permanent;

            location ~* ^/files/.*.(htm|html|svg|xml) {
                add_header Content-disposition "attachment";
                try_files /lms.localhost/public/$uri @webserver;
            }

            try_files /lms.localhost/public/$uri @webserver;
        }

        location @webserver {
            proxy_pass http://frappe-server;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Frappe-Site-Name lms.localhost;
            proxy_set_header Host $host;
            proxy_set_header X-Use-X-Accel-Redirect True;
            proxy_read_timeout 120;
            proxy_redirect http:// https://;
        }

        # Error pages
        error_page 502 /502.html;
        location /502.html {
            root /home/frappe/frappe-bench/sites;
            internal;
        }

        access_log /dev/stdout;
        error_log /dev/stderr;

        client_max_body_size 50m;
        client_body_buffer_size 16K;
        client_header_buffer_size 1k;

        keepalive_timeout 15;
    }
