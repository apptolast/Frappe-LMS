apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: apptolast-frappe-lms
  labels:
    app: frappe-lms
    environment: production
data:
  default.conf: |
    upstream frappe-server {
        server 127.0.0.1:8000 fail_timeout=0;
    }

    server {
        listen 80;
        server_name academy.apptolast.com;
        root /home/frappe/frappe-bench/sites;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # Assets estáticos
        location /assets {
            try_files $uri =404;
            add_header Cache-Control "max-age=31536000";
        }

        location ~ ^/protected/(.*) {
            internal;
            try_files /lms.localhost/$1 =404;
        }

        location /socket.io {
            proxy_pass http://frappe-server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Frappe-Site-Name lms.localhost;
            proxy_set_header Origin $scheme://$http_host;
            proxy_set_header Host $host;
        }

        location / {
            rewrite ^(.+)/$ $1 permanent;
            rewrite ^(.+)/index\.html$ $1 permanent;
            rewrite ^(.+)\.html$ $1 permanent;

            location ~* ^/files/.*.(htm|html|svg|xml) {
                add_header Content-disposition "attachment";
                try_files /lms.localhost/public/$uri @webserver;
            }

            try_files /lms.localhost/public/$uri @webserver;
        }

        location @webserver {
            proxy_pass http://frappe-server;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Frappe-Site-Name lms.localhost;
            proxy_set_header Host $host;
            proxy_set_header X-Use-X-Accel-Redirect True;
            proxy_read_timeout 120;
            proxy_redirect off;
        }

        # Error pages
        error_page 502 /502.html;
        location /502.html {
            root /home/frappe/frappe-bench/sites;
            internal;
        }

        access_log /dev/stdout;
        error_log /dev/stderr;

        client_max_body_size 50m;
        client_body_buffer_size 16K;
        client_header_buffer_size 1k;

        keepalive_timeout 15;
    }
