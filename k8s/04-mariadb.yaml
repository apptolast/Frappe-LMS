apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb-frappe-lms
  namespace: apptolast-frappe-lms
  labels:
    app: mariadb-frappe-lms
    environment: production
spec:
  serviceName: mariadb-frappe-lms
  replicas: 1
  selector:
    matchLabels:
      app: mariadb-frappe-lms
  template:
    metadata:
      labels:
        app: mariadb-frappe-lms
        environment: production
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.8
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --skip-character-set-client-handshake
            - --skip-innodb-read-only-compressed
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frappe-lms-secret
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-frappe-lms-data
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-frappe-lms
  namespace: apptolast-frappe-lms
  labels:
    app: mariadb-frappe-lms
    environment: production
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
      name: mysql
  selector:
    app: mariadb-frappe-lms
