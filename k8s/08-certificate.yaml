apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frappe-lms-tls
  namespace: apptolast-frappe-lms
spec:
  secretName: frappe-lms-tls
  issuerRef:
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - academy.apptolast.com
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days before expiration
