apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-lms
  namespace: apptolast-frappe-lms
  labels:
    app: frappe-lms
    environment: production
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frappe-lms
      environment: production
  template:
    metadata:
      labels:
        app: frappe-lms
        environment: production
        version: v1
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        # Init container para arreglar permisos
        - name: fix-permissions
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              chown -R 1000:1000 /sites /logs
              chmod -R 755 /sites /logs
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: sites
              mountPath: /sites
            - name: logs
              mountPath: /logs
        # Init container para copiar archivos base de sites
        - name: copy-sites-base
          image: apptolast/frappe-lms:latest
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              set -e
              # Si apps.txt no existe en el volumen, copiar archivos base
              if [ ! -f "/mnt/sites/apps.txt" ]; then
                echo "Copiando archivos base de sites..."
                cp -a /home/frappe/frappe-bench/sites/. /mnt/sites/
                echo "Archivos copiados"
              else
                echo "Sites ya inicializado"
              fi
          volumeMounts:
            - name: sites
              mountPath: /mnt/sites
        # Init container para configurar el site si no existe
        - name: site-init
          image: apptolast/frappe-lms:latest
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              set -e
              cd /home/frappe/frappe-bench

              # Copiar configuración común
              if [ -f /config/common_site_config.json ]; then
                cp /config/common_site_config.json sites/common_site_config.json
              fi

              # Verificar si el site ya existe
              if [ ! -d "sites/lms.localhost" ]; then
                echo "Creando nuevo site..."
                bench new-site lms.localhost \
                  --mariadb-root-password "$MYSQL_ROOT_PASSWORD" \
                  --admin-password "$FRAPPE_ADMIN_PASSWORD" \
                  --db-host mariadb-frappe-lms \
                  --no-mariadb-socket

                bench --site lms.localhost install-app erpnext
                bench --site lms.localhost install-app lms
                bench --site lms.localhost install-app education
                bench --site lms.localhost set-config developer_mode 0
                bench use lms.localhost
                echo "Site creado exitosamente"
              else
                echo "Site ya existe, ejecutando migraciones..."
                bench --site lms.localhost migrate || true
              fi
              
              # Crear symlink para el dominio academy.apptolast.com
              ln -sf lms.localhost sites/academy.apptolast.com
              echo "Symlink academy.apptolast.com creado"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frappe-lms-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: FRAPPE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frappe-lms-secret
                  key: FRAPPE_ADMIN_PASSWORD
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      containers:
        # Nginx para servir assets estáticos
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
        # Contenedor frappe-lms (incluye gunicorn y socketio)
        - name: frappe-lms
          image: apptolast/frappe-lms:latest
          imagePullPolicy: Always
          ports:
            - name: gunicorn
              containerPort: 8000
              protocol: TCP
            - name: socketio
              containerPort: 9000
              protocol: TCP
          env:
            # PayPal Sandbox credentials from secret
            - name: PAYPAL_SANDBOX_USERNAME
              valueFrom:
                secretKeyRef:
                  name: frappe-lms-secret
                  key: PAYPAL_SANDBOX_USERNAME
            - name: PAYPAL_SANDBOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frappe-lms-secret
                  key: PAYPAL_SANDBOX_PASSWORD
            - name: PAYPAL_SANDBOX_SIGNATURE
              valueFrom:
                secretKeyRef:
                  name: frappe-lms-secret
                  key: PAYPAL_SANDBOX_SIGNATURE
          command:
            - /bin/bash
            - -c
            - |
              cd /home/frappe/frappe-bench
              
              # Inject PayPal credentials and CORS config into site_config
              SITE_CONFIG="/home/frappe/frappe-bench/sites/lms.localhost/site_config.json"
              if [ -f "$SITE_CONFIG" ]; then
                python3 -c "
              import json, os
              try:
                  with open('$SITE_CONFIG', 'r') as f:
                      c = json.load(f)
                  c['sandbox_api_username'] = os.environ.get('PAYPAL_SANDBOX_USERNAME', '')
                  c['sandbox_api_password'] = os.environ.get('PAYPAL_SANDBOX_PASSWORD', '')
                  c['sandbox_signature'] = os.environ.get('PAYPAL_SANDBOX_SIGNATURE', '')
                  c['allow_cors'] = ['https://academy.apptolast.com']
                  c['host_name'] = 'https://academy.apptolast.com'
                  with open('$SITE_CONFIG', 'w') as f:
                      json.dump(c, f, indent=2)
                  print('Config injected: PayPal + CORS')
              except Exception as e:
                  print(f'Warning: {e}')
              "
              fi
              
              # Start socketio in background with proper site name
              export FRAPPE_SITE_NAME_HEADER=lms.localhost
              node /home/frappe/frappe-bench/apps/frappe/socketio.js &
              
              # Start gunicorn in foreground
              exec /home/frappe/frappe-bench/env/bin/gunicorn \
                --chdir=/home/frappe/frappe-bench/sites \
                --bind=0.0.0.0:8000 \
                --threads=4 \
                --workers=2 \
                --worker-class=gthread \
                --worker-tmp-dir=/dev/shm \
                --timeout=120 \
                --preload \
                frappe.app:application
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
          resources:
            requests:
              memory: "1Gi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/method/ping
              port: 8000
              httpHeaders:
                - name: Host
                  value: lms.localhost
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/method/ping
              port: 8000
              httpHeaders:
                - name: Host
                  value: lms.localhost
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/method/ping
              port: 8000
              httpHeaders:
                - name: Host
                  value: lms.localhost
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-lms-sites
        - name: logs
          persistentVolumeClaim:
            claimName: frappe-lms-logs
        - name: config
          configMap:
            name: frappe-lms-config
        - name: nginx-config
          configMap:
            name: nginx-config
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
# Deployment para el worker de Frappe (background jobs)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-lms-worker
  namespace: apptolast-frappe-lms
  labels:
    app: frappe-lms-worker
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frappe-lms-worker
  template:
    metadata:
      labels:
        app: frappe-lms-worker
        environment: production
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: worker
          image: apptolast/frappe-lms:latest
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              cd /home/frappe/frappe-bench
              bench worker --queue default,short,long
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-lms-sites
        - name: logs
          persistentVolumeClaim:
            claimName: frappe-lms-logs
      restartPolicy: Always
---
# Deployment para el scheduler de Frappe (tareas programadas)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-lms-scheduler
  namespace: apptolast-frappe-lms
  labels:
    app: frappe-lms-scheduler
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frappe-lms-scheduler
  template:
    metadata:
      labels:
        app: frappe-lms-scheduler
        environment: production
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: scheduler
          image: apptolast/frappe-lms:latest
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              cd /home/frappe/frappe-bench
              bench schedule
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-lms-sites
        - name: logs
          persistentVolumeClaim:
            claimName: frappe-lms-logs
      restartPolicy: Always
